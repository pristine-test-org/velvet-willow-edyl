<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impeccable test drive · Velvet Willow</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span class="mark">Velvet Willow</span>
      <a href="/">Back to the landing page</a>
    </header>
    <main>
      <!-- Intentional, for Impeccable's test drive: gradient text on the heading. -->
      <h1 class="gradient">What the willow keeps</h1>
      <!-- Intentional, for Impeccable's test drive: low-contrast text in solid light grey. -->
      <p class="soft">A short note on how Velvet Willow keeps its list, written so a review has something to read.</p>
      <!-- Intentional, for Impeccable's test drive: paragraph flush with the viewport edges, no background. -->
      <p class="edge">Every item on the list is stored once and shown to everyone who opens the page, newest first.</p>
      <!-- Intentional, for Impeccable's test drive: link text under the 11px floor. -->
      <a class="tiny" href="/#live">See the live list</a>
      <!-- Intentional, for Impeccable's test drive: a layout transition on width. -->
      <div class="bar"><span></span></div>
    </main>
  </body>
</html>
